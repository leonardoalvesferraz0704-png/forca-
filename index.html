<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forca Neon — Jogo da Forca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS DE DESIGN (tema escuro padrão) ============ */
:root{
  --bg:#07060f; --bg2:#14092b; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.14); --text:#eaf0ff; --muted:#9aa3c7;
  --cyan:#00f0ff; --pink:#ff2bd6; --ok:#38ffa0; --bad:#ff4d6d; --warn:#ffd23f;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --font-ui:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Orbitron','Chakra Petch',system-ui,sans-serif;
}
/* Tema claro: mesmas variáveis, valores adaptados para contraste */
[data-theme="light"]{
  --bg:#eef1fb; --bg2:#d9def5; --glass:rgba(255,255,255,.7); --glass2:rgba(255,255,255,.95);
  --border:rgba(40,40,90,.18); --text:#161a33; --muted:#4f5680;
  --cyan:#007c8a; --pink:#c0189f; --ok:#0a8f55; --bad:#d6203f; --warn:#a87400;
  --shadow:0 20px 50px rgba(40,40,90,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%; font-family:var(--font-ui); color:var(--text);
  background:
    radial-gradient(900px 500px at 10% -10%, color-mix(in srgb,var(--pink) 28%,transparent), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, color-mix(in srgb,var(--cyan) 24%,transparent), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
  transition:background .4s,color .3s;
}
/* Grade sutil ao fundo, no clima cyberpunk */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);
}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.app{position:relative;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ============ CABEÇALHO ============ */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,4.5vw,2rem);letter-spacing:.04em;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--pink) 45%,transparent))}
.tools{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;font-size:1.15rem;
  transition:transform .15s,border-color .2s,box-shadow .2s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 18px color-mix(in srgb,var(--cyan) 40%,transparent)}
.icon-btn:active{transform:scale(.94)}

/* ============ CARTÕES GLASSMORPHISM ============ */
.card{background:var(--glass);border:1px solid var(--border);border-radius:22px;padding:16px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}

/* Barra de controles */
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
select{padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--glass2);
  color:var(--text);font-weight:500;cursor:pointer;min-height:44px}
select option{color:#111}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--glass2);
  cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 16px color-mix(in srgb,var(--cyan) 35%,transparent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 70%,#000),color-mix(in srgb,var(--pink) 70%,#000));
  border-color:transparent;color:#fff}
.btn-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 130px}

/* ============ ÁREA DO JOGO ============ */
.game{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){
  .controls{grid-template-columns:200px 220px 1fr;align-items:end}
  .btn-row{grid-column:auto;flex-wrap:nowrap;justify-content:flex-end}
  .btn-row .btn{flex:0 0 auto}
  .game{grid-template-columns:minmax(300px,380px) 1fr}
}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
#canvas{width:100%;max-width:300px;aspect-ratio:300/340;border-radius:16px;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--cyan) 10%,transparent),transparent 70%)}
#canvas.shake{animation:shake .5s}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.chip{flex:1 1 90px;text-align:center;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--glass2)}
.chip small{display:block;color:var(--muted);font-size:.72rem}
.chip b{font-family:var(--font-display);font-size:1.05rem}
.chip.low b{color:var(--bad);animation:pulse 1s infinite}
.bar{width:100%;height:6px;border-radius:99px;background:var(--glass2);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));transition:width 1s linear}

.board{position:relative;display:flex;flex-direction:column;gap:16px}
.category-tag{align-self:flex-start;padding:5px 12px;border-radius:99px;font-size:.85rem;
  border:1px solid var(--pink);color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,transparent)}
/* A palavra secreta: o momento de destaque visual do jogo */
.word{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:8px 0}
.slot{width:clamp(30px,8vw,52px);height:clamp(42px,10vw,64px);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,5vw,2.1rem);
  border-bottom:3px solid var(--cyan);border-radius:6px 6px 0 0;background:var(--glass);
  box-shadow:0 8px 18px -10px var(--cyan);transition:background .3s}
.slot.rev{color:var(--cyan);text-shadow:0 0 16px var(--cyan);animation:flip .5s}
.slot.fail{color:var(--bad);border-color:var(--bad);text-shadow:0 0 12px var(--bad);box-shadow:none}
.gap{width:clamp(14px,4vw,26px)}
.sep{align-self:end;font-size:2rem;color:var(--muted);padding:0 2px}
.hint-box{min-height:46px;padding:10px 14px;border-radius:14px;border:1px dashed var(--warn);
  color:var(--warn);font-size:.95rem;display:none;animation:rise .4s}
.hint-box.on{display:block}
.status{text-align:center;min-height:1.4em;color:var(--muted);font-size:.95rem}

/* Teclado virtual */
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.key{height:46px;border-radius:12px;border:1px solid var(--border);background:var(--glass2);cursor:pointer;
  font-family:var(--font-display);font-weight:600;font-size:1rem;transition:transform .12s,background .2s,box-shadow .2s}
.key:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 14px color-mix(in srgb,var(--cyan) 40%,transparent)}
.key:active:not(:disabled){transform:scale(.92)}
.key:disabled{cursor:default}
.key.hit{background:color-mix(in srgb,var(--ok) 25%,transparent);border-color:var(--ok);color:var(--ok);animation:pop .4s}
.key.miss{background:color-mix(in srgb,var(--bad) 20%,transparent);border-color:var(--bad);color:var(--bad);opacity:.6;animation:shake .4s}
@media(min-width:520px){.kb{grid-template-columns:repeat(9,1fr)}}
.shortcuts{font-size:.78rem;color:var(--muted);text-align:center}

/* Overlay de pausa */
.pause{position:absolute;inset:-6px;border-radius:18px;display:none;place-items:center;text-align:center;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  cursor:pointer;z-index:5;font-family:var(--font-display);font-size:1.1rem;padding:20px}
.pause.on{display:grid}

/* ============ MODAIS ============ */
dialog{margin:auto;border:1px solid var(--border);border-radius:24px;padding:22px;width:min(480px,calc(100% - 28px));
  background:color-mix(in srgb,var(--bg2) 88%,transparent);color:var(--text);box-shadow:var(--shadow);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog[open]{animation:rise .35s}
dialog h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--glass)}
.stat small{color:var(--muted);display:block}
.stat b{font-family:var(--font-display);font-size:1.3rem;color:var(--cyan)}
.words{display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow:auto;margin:8px 0 14px}
.words span{padding:3px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--border);background:var(--glass)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions .btn{flex:1 1 120px}
.end-title.win{color:var(--ok);text-shadow:0 0 18px var(--ok)}
.end-title.lose{color:var(--bad);text-shadow:0 0 18px var(--bad)}
.breakdown{margin:12px 0;display:grid;gap:4px;font-size:.92rem;color:var(--muted)}
.breakdown div{display:flex;justify-content:space-between}
.breakdown .total{color:var(--text);font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:4px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ============ ANIMAÇÕES ============ */
@keyframes flip{from{transform:rotateX(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
/* Respeita usuários que preferem menos movimento */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Cabeçalho ===== -->
  <header>
    <div class="logo">FORCA NEON</div>
    <div class="tools">
      <button class="icon-btn" id="statsBtn" title="Estatísticas" aria-label="Abrir estatísticas">📊</button>
      <button class="icon-btn" id="soundBtn" title="Som" aria-label="Ligar ou desligar som">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Alternar tema claro e escuro">🌙</button>
    </div>
  </header>

  <!-- ===== Controles ===== -->
  <section class="card controls" aria-label="Controles do jogo">
    <label class="field">Dificuldade
      <select id="selDiff">
        <option value="facil">Fácil — 8 tentativas</option>
        <option value="medio">Médio — 6 tentativas</option>
        <option value="dificil">Difícil — 4 tentativas + 60 s</option>
      </select>
    </label>
    <label class="field">Categoria
      <select id="selCat"></select>
    </label>
    <div class="btn-row">
      <button class="btn primary" id="btnNew">Nova partida</button>
      <button class="btn" id="btnPause">Pausar</button>
      <button class="btn" id="btnHint">Usar dica</button>
    </div>
  </section>

  <!-- ===== Jogo ===== -->
  <main class="game">
    <section class="card stage" aria-label="Forca">
      <canvas id="canvas" width="600" height="680" role="img" aria-label="Desenho da forca"></canvas>
      <div class="chips">
        <div class="chip" id="chipLives"><small>Tentativas</small><b id="lives">6</b></div>
        <div class="chip" id="chipTime"><small id="timeLabel">Tempo</small><b id="time">00:00</b></div>
        <div class="chip"><small>Sequência</small><b id="streakNow">0</b></div>
      </div>
      <div class="bar" id="timeBar"><i id="timeFill"></i></div>
    </section>

    <section class="card board">
      <span class="category-tag" id="catTag">Categoria</span>
      <div class="word" id="word" aria-live="polite"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="kb" id="kb"></div>
      <div class="shortcuts">Digite no teclado físico · Enter: nova partida · Esc: pausar · ?: dica</div>
      <div class="pause" id="pause">⏸ Jogo pausado<br><small>Toque ou pressione Esc para continuar</small></div>
    </section>
  </main>
</div>

<!-- ===== Modal de estatísticas ===== -->
<dialog id="dlgStats" aria-labelledby="tStats">
  <h2 id="tStats">Estatísticas</h2>
  <div class="stats-grid" id="statsGrid"></div>
  <strong>Palavras descobertas</strong>
  <div class="words" id="wordsFound"></div>
  <div class="modal-actions">
    <button class="btn" id="btnClear">Limpar estatísticas</button>
    <button class="btn primary" id="btnCloseStats">Fechar</button>
  </div>
</dialog>

<!-- ===== Modal de fim de partida ===== -->
<dialog id="dlgEnd" aria-labelledby="endTitle">
  <h2 class="end-title" id="endTitle"></h2>
  <p id="endMsg"></p>
  <div class="breakdown" id="breakdown"></div>
  <div class="modal-actions">
    <button class="btn" id="btnEndStats">Estatísticas</button>
    <button class="btn primary" id="btnAgain">Jogar novamente</button>
  </div>
</dialog>

<canvas id="confetti"></canvas>

<script>
"use strict";
/* =====================================================================
   FORCA NEON — Jogo da Forca em HTML5, CSS3 e JavaScript puro
   Seções: 1) Dados  2) Utilidades  3) Áudio  4) Persistência
           5) Canvas  6) Estado e lógica  7) Interface  8) Eventos
   ===================================================================== */

/* ---------- 1) DADOS: palavras no formato "Palavra|Dica" ---------- */
const BANCO = {
  tecnologia: { nome: "Tecnologia", itens: [
    "Algoritmo|Sequência de passos para resolver um problema",
    "Javascript|Linguagem que roda dentro do navegador",
    "Processador|O cérebro do computador",
    "Criptografia|Embaralha dados para protegê-los",
    "Roteador|Distribui a internet pela casa",
    "Blockchain|Cadeia de blocos por trás das criptomoedas",
    "Teclado|Periférico de entrada cheio de teclas",
    "Servidor|Computador que atende pedidos pela rede",
    "Navegador|Programa usado para abrir sites",
    "Linux|Sistema operacional que tem um pinguim como mascote" ] },
  filmes: { nome: "Filmes e Séries", itens: [
    "Matrix|Pílula vermelha ou pílula azul?",
    "Titanic|Navio que afundou em 1912 e virou romance no cinema",
    "Interestelar|Viagem por um buraco de minhoca para salvar a Terra",
    "Gladiador|General romano vira lutador de arena",
    "Coringa|Vilão que ri e vive em Gotham",
    "Avatar|Povo azul que vive em Pandora",
    "Stranger Things|Série com o Mundo Invertido e a Eleven",
    "Breaking Bad|Professor de química vira produtor de metanfetamina",
    "Parasita|Filme sul-coreano que ganhou o Oscar de melhor filme",
    "A Origem|Sonhos dentro de sonhos, dirigido por Christopher Nolan" ] },
  paises: { nome: "Países e Cidades", itens: [
    "Brasil|Maior país da América do Sul",
    "Japão|Conhecido como a terra do sol nascente",
    "Portugal|País europeu cuja capital é Lisboa",
    "Argentina|País onde fica Buenos Aires",
    "Egito|Terra das pirâmides e dos faraós",
    "Canadá|Tem uma folha de bordo na bandeira",
    "Austrália|País-continente dos cangurus",
    "Islândia|Ilha de gelo e vulcões no Atlântico Norte",
    "Veneza|Cidade italiana cortada por canais",
    "Estados Unidos|Sua capital é Washington, D.C." ] },
  ciencia: { nome: "Ciência e Astronomia", itens: [
    "Galáxia|Conjunto de bilhões de estrelas",
    "Gravidade|Força que nos mantém no chão",
    "Telescópio|Instrumento para observar astros distantes",
    "Supernova|Explosão gigantesca de uma estrela",
    "Átomo|Menor parte de um elemento químico",
    "Eclipse|Um astro encobre a luz de outro",
    "Saturno|Planeta famoso pelos anéis",
    "Buraco Negro|Nem a luz consegue escapar dele",
    "Fotossíntese|Plantas transformam luz em energia",
    "Evolução|Teoria de Charles Darwin" ] },
  animais: { nome: "Animais", itens: [
    "Elefante|Maior animal terrestre",
    "Golfinho|Mamífero marinho muito inteligente",
    "Camaleão|Muda de cor para se camuflar",
    "Pinguim|Ave que não voa e vive em regiões geladas",
    "Girafa|Tem o pescoço mais longo do reino animal",
    "Tartaruga|Carrega a casa nas costas",
    "Borboleta|Antes de voar, era uma lagarta",
    "Morcego|Único mamífero capaz de voar",
    "Onça-pintada|Maior felino das Américas",
    "Ornitorrinco|Mamífero australiano que bota ovos" ] }
};
/* Configuração das dificuldades */
const DIFICULDADES = {
  facil:   { tentativas: 8, limite: 0,  mult: 1,   dicaGratis: true  },
  medio:   { tentativas: 6, limite: 0,  mult: 1.5, dicaGratis: false },
  dificil: { tentativas: 4, limite: 60, mult: 2,   dicaGratis: false }
};

/* ---------- 2) UTILIDADES ---------- */
const $ = (id) => document.getElementById(id);
/* Remove acentos e coloca em maiúsculas: "Átomo" -> "ATOMO" */
const normalizar = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
const fmtTempo = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
/* Escapa texto antes de inserir como HTML (segurança contra injeção) */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 3) ÁUDIO sintético (Web Audio API) ---------- */
let audioCtx = null;
let somLigado = true;
/* O AudioContext só pode ser criado após uma interação do usuário */
function ctxAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
/* Toca uma nota: frequência inicial/final, duração, onda, atraso e volume */
function nota(f1, dur, tipo = "sine", atraso = 0, vol = 0.12, f2 = f1) {
  if (!somLigado) return;
  const c = ctxAudio(); if (!c) return;
  const t = c.currentTime + atraso;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = tipo;
  osc.frequency.setValueAtTime(f1, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(c.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const SOM = {
  clique: () => nota(520, 0.05, "square", 0, 0.05),
  acerto: () => { nota(660, 0.12, "sine"); nota(990, 0.18, "sine", 0.09); },
  erro:   () => nota(220, 0.3, "sawtooth", 0, 0.1, 90),
  dica:   () => [880, 1180, 1480].forEach((f, i) => nota(f, 0.15, "triangle", i * 0.07, 0.08)),
  tique:  () => nota(1000, 0.04, "square", 0, 0.04),
  vitoria:() => [523, 659, 784, 1047, 1319].forEach((f, i) => nota(f, 0.25, "triangle", i * 0.1, 0.12)),
  derrota:() => [392, 330, 262, 196].forEach((f, i) => nota(f, 0.4, "sawtooth", i * 0.2, 0.09, f * 0.8))
};

/* ---------- 4) PERSISTÊNCIA (localStorage) ---------- */
const CHAVE_STATS = "forcaNeon.stats.v1";
const CHAVE_CFG = "forcaNeon.config.v1";
const STATS_PADRAO = { melhor: 0, total: 0, sequencia: 0, melhorSeq: 0, jogos: 0, vitorias: 0, palavras: [] };
/* Leitura segura: se o storage estiver bloqueado ou corrompido, usa o padrão */
function ler(chave, padrao) {
  try { const v = JSON.parse(localStorage.getItem(chave)); return v && typeof v === "object" ? { ...padrao, ...v } : { ...padrao }; }
  catch { return { ...padrao }; }
}
function gravar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch { /* ignora */ } }
let stats = ler(CHAVE_STATS, STATS_PADRAO);
let cfg = ler(CHAVE_CFG, { tema: "dark", dif: "medio", cat: "tecnologia", som: true });
if (!Array.isArray(stats.palavras)) stats.palavras = [];
if (!DIFICULDADES[cfg.dif]) cfg.dif = "medio";
if (!BANCO[cfg.cat]) cfg.cat = "tecnologia";
somLigado = !!cfg.som;

/* ---------- 5) CANVAS: desenho da forca ---------- */
const cv = $("canvas"), g2 = cv.getContext("2d");
/* Cada função desenha uma parte do boneco/forca em coordenadas lógicas 300x340 */
const PARTES = [
  (c) => seg(c, 40, 310, 200, 310),              // 1 base
  (c) => seg(c, 80, 310, 80, 40),                // 2 poste
  (c) => { seg(c, 80, 40, 200, 40); seg(c, 80, 80, 120, 40); }, // 3 viga + reforço
  (c) => seg(c, 200, 40, 200, 80),               // 4 corda
  (c) => { c.beginPath(); c.arc(200, 105, 25, 0, Math.PI * 2); c.stroke(); }, // 5 cabeça
  (c) => seg(c, 200, 130, 200, 215),             // 6 tronco
  (c) => seg(c, 200, 150, 165, 190),             // 7 braço esq.
  (c) => seg(c, 200, 150, 235, 190),             // 8 braço dir.
  (c) => seg(c, 200, 215, 170, 270),             // 9 perna esq.
  (c) => seg(c, 200, 215, 230, 270)              // 10 perna dir.
];
function seg(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
const cor = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let animRaf = 0;
/* Redesenha tudo. "prog" (0..1) controla o fade-in da última parte */
function desenhar(estagio, prog = 1) {
  g2.setTransform(2, 0, 0, 2, 0, 0);
  g2.clearRect(0, 0, 300, 340);
  g2.lineCap = "round"; g2.lineJoin = "round"; g2.lineWidth = 6;
  const ruim = jogo && jogo.fim === "derrota", bom = jogo && jogo.fim === "vitoria";
  /* Estrutura fantasma: mostra onde a forca será montada */
  g2.strokeStyle = cor("--muted"); g2.globalAlpha = 0.18; g2.shadowBlur = 0;
  PARTES.slice(0, 4).forEach((p) => p(g2));
  for (let i = 0; i < estagio; i++) {
    const estrutura = i < 4;
    g2.strokeStyle = estrutura ? cor("--cyan") : (bom ? cor("--ok") : cor("--bad"));
    g2.shadowColor = g2.strokeStyle; g2.shadowBlur = 14;
    g2.globalAlpha = i === estagio - 1 ? prog : 1;
    PARTES[i](g2);
  }
  g2.globalAlpha = 1;
  /* Olhos "X" na derrota, sorriso na vitória */
  if (estagio >= 5) {
    g2.lineWidth = 3; g2.shadowBlur = 8;
    if (ruim) { seg(g2, 190, 98, 198, 106); seg(g2, 198, 98, 190, 106); seg(g2, 202, 98, 210, 106); seg(g2, 210, 98, 202, 106); }
    else if (bom) { g2.beginPath(); g2.arc(200, 108, 11, 0.15 * Math.PI, 0.85 * Math.PI); g2.stroke(); }
  }
  g2.shadowBlur = 0;
}
/* Anima a entrada da nova parte (fade-in de 400 ms) */
function animarEstagio(estagio) {
  cancelAnimationFrame(animRaf);
  const ini = performance.now();
  const passo = (agora) => {
    const p = Math.min(1, (agora - ini) / 400);
    desenhar(estagio, p);
    if (p < 1) animRaf = requestAnimationFrame(passo);
  };
  animRaf = requestAnimationFrame(passo);
}
/* Converte nº de erros em nº de partes (10 partes distribuídas pelas tentativas) */
const estagioDe = (erros, max) => Math.min(10, Math.round(erros * 10 / max));

/* ---------- 6) ESTADO E LÓGICA ---------- */
let jogo = null;          // partida atual
let relogio = null;       // setInterval do cronômetro
const usadas = {};        // palavras já sorteadas por categoria (evita repetição)

function sortear(cat) {
  const lista = BANCO[cat].itens;
  usadas[cat] = usadas[cat] || [];
  if (usadas[cat].length >= lista.length) usadas[cat] = [];
  let i; do { i = Math.floor(Math.random() * lista.length); } while (usadas[cat].includes(i));
  usadas[cat].push(i);
  const [palavra, dica] = lista[i].split("|");
  return { palavra, dica };
}

function novaPartida() {
  /* Abandonar uma partida já iniciada conta como derrota (evita "farm" de estatísticas) */
  if (jogo && !jogo.fim && (jogo.certas.size + jogo.erradas.size) > 0) registrarFim(false, true);
  pararRelogio();
  const d = DIFICULDADES[cfg.dif];
  const { palavra, dica } = sortear(cfg.cat);
  jogo = {
    palavra, dica, norm: normalizar(palavra), dif: d,
    certas: new Set(), erradas: new Set(), max: d.tentativas,
    dicaUsada: false, tempo: d.limite || 0, decorrido: 0, pausado: false, fim: null
  };
  $("selDiff").value = cfg.dif; $("selCat").value = cfg.cat;
  $("catTag").textContent = BANCO[cfg.cat].nome;
  $("hintBox").className = "hint-box"; $("hintBox").textContent = "";
  $("btnHint").disabled = false; $("btnPause").disabled = false; $("btnPause").textContent = "Pausar";
  $("pause").classList.remove("on");
  $("canvas").classList.remove("shake");
  $("timeBar").style.display = d.limite ? "block" : "none";
  $("timeFill").style.width = "100%";
  $("timeLabel").textContent = d.limite ? "Restante" : "Tempo";
  montarPalavra(); montarTeclado(); atualizarHUD();
  desenhar(0);
  msg("Escolha uma letra para começar.");
  iniciarRelogio();
}

function iniciarRelogio() {
  pararRelogio();
  relogio = setInterval(() => {
    if (!jogo || jogo.fim || jogo.pausado) return;
    jogo.decorrido++;
    if (jogo.dif.limite) {
      jogo.tempo--;
      if (jogo.tempo <= 10 && jogo.tempo > 0) SOM.tique();
      if (jogo.tempo <= 0) { jogo.tempo = 0; finalizar(false, "O tempo acabou!"); }
    }
    atualizarHUD();
  }, 1000);
}
function pararRelogio() { clearInterval(relogio); relogio = null; }

/* Processa uma tentativa de letra (A-Z) */
function tentar(letra) {
  if (!jogo || jogo.fim || jogo.pausado) return;
  if (jogo.certas.has(letra) || jogo.erradas.has(letra)) return;
  const btn = document.querySelector('.key[data-k="' + letra + '"]');
  if (jogo.norm.includes(letra)) {
    jogo.certas.add(letra);
    SOM.acerto();
    if (btn) { btn.disabled = true; btn.classList.add("hit"); }
    revelar(letra);
    const n = jogo.norm.split("").filter((c) => c === letra).length;
    msg("Boa! A letra " + letra + " aparece " + n + (n > 1 ? " vezes." : " vez."));
    if (venceu()) return finalizar(true);
  } else {
    jogo.erradas.add(letra);
    SOM.erro();
    if (btn) { btn.disabled = true; btn.classList.add("miss"); }
    animarEstagio(estagioDe(jogo.erradas.size, jogo.max));
    cv.classList.remove("shake"); void cv.offsetWidth; cv.classList.add("shake");
    msg("Não tem " + letra + ". Restam " + (jogo.max - jogo.erradas.size) + " tentativas.");
    if (jogo.erradas.size >= jogo.max) return finalizar(false, "A forca foi completada.");
  }
  atualizarHUD();
}
const venceu = () => [...jogo.norm].every((c) => !/[A-Z]/.test(c) || jogo.certas.has(c));

function usarDica() {
  if (!jogo || jogo.fim || jogo.pausado || jogo.dicaUsada) return;
  jogo.dicaUsada = true;
  const box = $("hintBox");
  box.textContent = "💡 " + jogo.dica; box.classList.add("on");
  $("btnHint").disabled = true;
  SOM.dica();
  msg(jogo.dif.dicaGratis ? "Dica liberada sem custo." : "Dica usada: -40 pontos se você vencer.");
}

function alternarPausa() {
  if (!jogo || jogo.fim) return;
  jogo.pausado = !jogo.pausado;
  $("pause").classList.toggle("on", jogo.pausado);
  $("btnPause").textContent = jogo.pausado ? "Continuar" : "Pausar";
  SOM.clique();
}

/* Encerra a partida, calcula pontos e atualiza estatísticas */
function finalizar(ganhou, motivo = "") {
  jogo.fim = ganhou ? "vitoria" : "derrota";
  pararRelogio();
  $("btnHint").disabled = true; $("btnPause").disabled = true;
  document.querySelectorAll(".key").forEach((k) => (k.disabled = true));
  const linhas = [];
  let pontos = 0;
  if (ganhou) {
    const m = jogo.dif.mult;
    const base = Math.round(100 * m);
    const vidas = Math.round((jogo.max - jogo.erradas.size) * 25 * m);
    const tempoB = jogo.dif.limite ? jogo.tempo * 3 : Math.max(0, 60 - jogo.decorrido) * 2;
    const penal = jogo.dicaUsada && !jogo.dif.dicaGratis ? 40 : 0;
    const seqB = (stats.sequencia + 1) * 10;
    pontos = Math.max(10, base + vidas + tempoB + seqB - penal);
    linhas.push(["Pontos base", base], ["Tentativas restantes", vidas], ["Bônus de tempo", tempoB], ["Bônus de sequência", seqB]);
    if (penal) linhas.push(["Uso da dica", -penal]);
    SOM.vitoria(); confete();
  } else {
    SOM.derrota();
    revelarTudo();
  }
  desenhar(estagioDe(jogo.erradas.size, jogo.max));
  registrarFim(ganhou, false, pontos);
  atualizarHUD();
  /* Modal de resultado após um breve respiro para ver a palavra */
  setTimeout(() => mostrarFim(ganhou, motivo, linhas, pontos), 900);
}

function registrarFim(ganhou, abandono, pontos = 0) {
  stats.jogos++;
  if (ganhou) {
    stats.vitorias++; stats.sequencia++; stats.total += pontos;
    stats.melhorSeq = Math.max(stats.melhorSeq, stats.sequencia);
    stats.melhor = Math.max(stats.melhor, pontos);
    if (!stats.palavras.includes(jogo.palavra)) stats.palavras.push(jogo.palavra);
  } else { stats.sequencia = 0; }
  gravar(CHAVE_STATS, stats);
  if (abandono) jogo.fim = "derrota";
}

/* ---------- 7) INTERFACE ---------- */
function msg(t) { $("status").textContent = t; }

/* Cria os espaços da palavra */
function montarPalavra() {
  const w = $("word"); w.innerHTML = "";
  [...jogo.palavra].forEach((ch, i) => {
    const n = jogo.norm[i];
    const el = document.createElement("span");
    if (ch === " ") el.className = "gap";
    else if (!/[A-Z]/.test(n)) { el.className = "sep"; el.textContent = ch; }
    else { el.className = "slot"; el.dataset.n = n; el.dataset.c = ch.toUpperCase(); }
    w.appendChild(el);
  });
  w.setAttribute("aria-label", "Palavra com " + jogo.norm.replace(/[^A-Z]/g, "").length + " letras");
}
function revelar(letra) {
  document.querySelectorAll('.slot[data-n="' + letra + '"]').forEach((s, i) => {
    s.textContent = s.dataset.c; s.style.animationDelay = i * 90 + "ms"; s.classList.add("rev");
  });
}
function revelarTudo() {
  document.querySelectorAll(".slot").forEach((s) => {
    if (!s.textContent) { s.textContent = s.dataset.c; s.classList.add("fail"); }
  });
}
function montarTeclado() {
  const kb = $("kb"); kb.innerHTML = "";
  for (let i = 65; i <= 90; i++) {
    const l = String.fromCharCode(i);
    const b = document.createElement("button");
    b.className = "key"; b.textContent = l; b.dataset.k = l; b.type = "button";
    b.setAttribute("aria-label", "Letra " + l);
    b.addEventListener("click", () => { SOM.clique(); tentar(l); });
    kb.appendChild(b);
  }
}
function atualizarHUD() {
  if (!jogo) return;
  const rest = jogo.max - jogo.erradas.size;
  $("lives").textContent = rest;
  $("chipLives").classList.toggle("low", rest <= 2 && !jogo.fim);
  const dif = jogo.dif.limite;
  $("time").textContent = fmtTempo(dif ? jogo.tempo : jogo.decorrido);
  $("chipTime").classList.toggle("low", !!dif && jogo.tempo <= 10 && !jogo.fim);
  if (dif) $("timeFill").style.width = (jogo.tempo / dif * 100) + "%";
  $("streakNow").textContent = stats.sequencia;
}

/* Modal de fim de partida */
function mostrarFim(ganhou, motivo, linhas, pontos) {
  const t = $("endTitle");
  t.textContent = ganhou ? "Você venceu!" : "Fim de jogo";
  t.className = "end-title " + (ganhou ? "win" : "lose");
  $("endMsg").innerHTML = (ganhou ? "Você descobriu " : (esc(motivo) + " A palavra era ")) + "<b>" + esc(jogo.palavra) + "</b>.";
  const bd = $("breakdown");
  bd.innerHTML = linhas.map(([k, v]) => "<div><span>" + esc(k) + "</span><span>" + (v > 0 ? "+" : "") + v + "</span></div>").join("") +
    (ganhou ? '<div class="total"><span>Total da rodada</span><span>' + pontos + "</span></div>" : "");
  if (!$("dlgEnd").open) $("dlgEnd").showModal();
}
function mostrarStats() {
  const taxa = stats.jogos ? Math.round(stats.vitorias / stats.jogos * 100) : 0;
  const itens = [["Maior pontuação", stats.melhor], ["Pontos totais", stats.total], ["Sequência atual", stats.sequencia],
    ["Melhor sequência", stats.melhorSeq], ["Total de jogos", stats.jogos], ["Taxa de vitória", taxa + "%"]];
  $("statsGrid").innerHTML = itens.map(([k, v]) => "<div class='stat'><small>" + esc(k) + "</small><b>" + esc(v) + "</b></div>").join("");
  $("wordsFound").innerHTML = stats.palavras.length
    ? stats.palavras.map((p) => "<span>" + esc(p) + "</span>").join("")
    : "<span>Nenhuma ainda. Vença uma partida para colecionar palavras.</span>";
  if (!$("dlgStats").open) $("dlgStats").showModal();
}

/* Confete simples em canvas (vitória) */
function confete() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cores = [cor("--cyan"), cor("--pink"), cor("--ok"), cor("--warn")];
  const ps = Array.from({ length: 140 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.4,
    vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4, s: 4 + Math.random() * 6,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cores[Math.floor(Math.random() * cores.length)]
  }));
  let frames = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); x.restore(); });
    if (++frames < 200) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* Tema e som */
function aplicarTema() {
  document.documentElement.dataset.theme = cfg.tema;
  $("themeBtn").textContent = cfg.tema === "dark" ? "🌙" : "☀️";
  if (jogo) desenhar(estagioDe(jogo.erradas.size, jogo.max));
}
function aplicarSom() { $("soundBtn").textContent = somLigado ? "🔊" : "🔇"; }
const salvarCfg = () => { cfg.som = somLigado; gravar(CHAVE_CFG, cfg); };

/* ---------- 8) EVENTOS ---------- */
(function iniciar() {
  /* Preenche o seletor de categorias a partir do banco de dados */
  $("selCat").innerHTML = Object.entries(BANCO).map(([k, v]) => '<option value="' + k + '">' + esc(v.nome) + "</option>").join("");
  $("selDiff").value = cfg.dif; $("selCat").value = cfg.cat;
  aplicarTema(); aplicarSom();

  $("selDiff").addEventListener("change", (e) => { cfg.dif = e.target.value; salvarCfg(); SOM.clique(); novaPartida(); });
  $("selCat").addEventListener("change", (e) => { cfg.cat = e.target.value; salvarCfg(); SOM.clique(); novaPartida(); });
  $("btnNew").addEventListener("click", () => { SOM.clique(); novaPartida(); });
  $("btnPause").addEventListener("click", alternarPausa);
  $("pause").addEventListener("click", alternarPausa);
  $("btnHint").addEventListener("click", usarDica);
  $("statsBtn").addEventListener("click", () => { SOM.clique(); mostrarStats(); });
  $("btnCloseStats").addEventListener("click", () => $("dlgStats").close());
  $("btnClear").addEventListener("click", () => {
    if (confirm("Apagar todas as estatísticas salvas? Esta ação não pode ser desfeita.")) {
      stats = { ...STATS_PADRAO, palavras: [] }; gravar(CHAVE_STATS, stats); mostrarStats(); atualizarHUD();
    }
  });
  $("btnAgain").addEventListener("click", () => { $("dlgEnd").close(); novaPartida(); });
  $("btnEndStats").addEventListener("click", () => { $("dlgEnd").close(); mostrarStats(); });
  $("themeBtn").addEventListener("click", () => { cfg.tema = cfg.tema === "dark" ? "light" : "dark"; salvarCfg(); aplicarTema(); SOM.clique(); });
  $("soundBtn").addEventListener("click", () => { somLigado = !somLigado; aplicarSom(); salvarCfg(); SOM.clique(); });

  /* Teclado físico: letras, Enter (nova partida), Esc (pausa) e ? (dica) */
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.tagName === "SELECT") return;
    const aberto = $("dlgEnd").open || $("dlgStats").open;
    if (e.key === "Enter" && $("dlgEnd").open) { e.preventDefault(); $("dlgEnd").close(); novaPartida(); return; }
    if (aberto) return;
    if (e.key === "Escape") { alternarPausa(); return; }
    if (e.key === "Enter" && jogo && jogo.fim) { novaPartida(); return; }
    if (e.key === "?") { usarDica(); return; }
    const l = normalizar(e.key);
    if (/^[A-Z]$/.test(l) && e.key.length === 1) { SOM.clique(); tentar(l); }
  });

  /* Pausa automática ao sair da aba, para não perder tempo sem querer */
  document.addEventListener("visibilitychange", () => { if (document.hidden && jogo && !jogo.fim && !jogo.pausado) alternarPausa(); });
  addEventListener("resize", () => { const c = $("confetti"); c.width = innerWidth; c.height = innerHeight; });

  novaPartida();
})();
</script>
<script src="multi.js"></script>
</body>
